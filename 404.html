<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - Real Estate Insight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2d5a8c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 120px;
            margin-bottom: 20px;
            color: #d4af37;
            font-weight: bold;
        }
        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
            opacity: 0.9;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #d4af37;
            color: #1a365d;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        a:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }
        .secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔍</div>
        <h1>404</h1>
        <h2>페이지를 찾을 수 없습니다</h2>
        <p>죄송합니다. 찾으시는 페이지가 존재하지 않거나 이동되었을 수 있습니다.</p>
        
        <div class="button-group">
            <a href="/">🏠 홈으로 돌아가기</a>
            <a href="/#guides" class="secondary">📚 가이드 보기</a>
        </div>
        
        <p style="margin-top: 40px; font-size: 14px; opacity: 0.7;">
            문제가 계속되면 <a href="mailto:ca.realtor.david@gmail.com" style="color: #d4af37;">contact@real-estate-insight.com</a>으로 연락주세요.
        </p>
    </div>
</body>
</html>
