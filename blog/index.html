<body>

    <!-- ========== 블로그 로드 스크립트 ========== -->
    <script>
        let allBlogs = [];
        let filteredBlogs = [];
        const blogsPerPage = 6;
        let currentPage = 1;

        async function loadBlogs() {
            try {
                console.log('📝 블로그 로드 시작...');
                
                const response = await fetch('/blog/blog.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ 블로그 로드 완료:', data.blogs.length, '개');
                
                allBlogs = data.blogs;
                filteredBlogs = [...allBlogs];
                
                // 카테고리 필터 채우기
                const categories = [...new Set(allBlogs.map(blog => blog.category))];
                const categorySelect = document.getElementById('category-filter');
                
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categorySelect.appendChild(option);
                });

                // 초기 표시
                displayBlogs();
                
                // 필터 이벤트 리스너
                categorySelect.addEventListener('change', filterBlogs);
            } catch (error) {
                console.error('💥 블로그 로드 실패:', error);
            }
        }

        function displayBlogs() {
            const startIdx = (currentPage - 1) * blogsPerPage;
            const endIdx = startIdx + blogsPerPage;
            const pagedBlogs = filteredBlogs.slice(startIdx, endIdx);

            const blogList = document.getElementById('blog-list');
            
            const blogHTML = pagedBlogs.map(blog => `
                <a href="${blog.url}" class="blog-card">
                    <div class="blog-image" style="background: url('${blog.image}') center/cover;"></div>
                    <div class="blog-content">
                        <span class="blog-category">${blog.category}</span>
                        <h3>${blog.title}</h3>
                        <p>${blog.description}</p>
                        <div class="blog-meta">
                            <span>📅 ${blog.date}</span>
                            <span>👤 ${blog.author}</span>
                        </div>
                    </div>
                </a>
            `).join('');

            blogList.innerHTML = blogHTML;

            // 페이지네이션
            displayPagination();
        }

        function displayPagination() {
            const totalPages = Math.ceil(filteredBlogs.length / blogsPerPage);
            const pagination = document.getElementById('pagination');
            let paginationHTML = '';

            // 이전 버튼
            if (currentPage > 1) {
                paginationHTML += `<a onclick="goToPage(${currentPage - 1})">← 이전</a>`;
            }

            // 페이지 번호
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<span class="active">${i}</span>`;
                } else {
                    paginationHTML += `<a onclick="goToPage(${i})">${i}</a>`;
                }
            }

            // 다음 버튼
            if (currentPage < totalPages) {
                paginationHTML += `<a onclick="goToPage(${currentPage + 1})">다음 →</a>`;
            }

            pagination.innerHTML = paginationHTML;
        }

        function goToPage(page) {
            currentPage = page;
            displayBlogs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterBlogs() {
            const selectedCategory = document.getElementById('category-filter').value;
            
            if (selectedCategory === '') {
                filteredBlogs = [...allBlogs];
            } else {
                filteredBlogs = allBlogs.filter(blog => blog.category === selectedCategory);
            }

            currentPage = 1;
            displayBlogs();
        }

        function resetFilter() {
            document.getElementById('category-filter').value = '';
            filteredBlogs = [...allBlogs];
            currentPage = 1;
            displayBlogs();
        }

        // 페이지 로드 시 블로그 로드
        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
