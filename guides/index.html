<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">| 미국 부동산 인사이트 | <span>Real Estate Insight</span></a>

                    <li><a href="/#contact">문의</a></li>
                </ul>
            </nav>

    <main class="container">
        <div class="hero">
            <h1>📚 LA 부동산 가이드</h1>
            <p>부동산 구매부터 세금, 법규까지 모든 정보</p>
        </div>

        <!-- 검색 섹션 -->
        <div class="search-section">
            <input type="text" id="search-input" placeholder="가이드 검색... (예: 모기지, 세금)">
            <button onclick="clearSearch()">초기화</button>
        </div>

        <!-- 결과 카운트 -->
        <div class="search-result-count" id="result-count"></div>

        <!-- 가이드 목록 -->
        <div class="guide-list">
            <ul id="guides-list">
                <!-- JSON에서 동적으로 생성됨 -->
            </ul>
        </div>

        <!-- 검색 결과 없음 -->

            <p>🔍 검색 결과가 없습니다.</p>

    <script>
        let allGuides = [];

        async function loadGuides() {
            try {
                console.log('📚 가이드 로드 시작...');
                
                const response = await fetch('/guides/guides.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ 가이드 로드 완료:', data.guides.length, '개');
                
                allGuides = data.guides;
                displayGuides(allGuides);

                // 검색 이벤트 리스너
                document.getElementById('search-input').addEventListener('keyup', searchGuides);
            } catch (error) {
                console.error('💥 가이드 로드 실패:', error);
            }
        }

        function displayGuides(guides) {
            const guidesList = document.getElementById('guides-list');
            const noResults = document.getElementById('no-results');
            const resultCount = document.getElementById('result-count');

            if (guides.length === 0) {
                guidesList.innerHTML = '';
                noResults.style.display = 'block';
                resultCount.textContent = '';
                return;
            }

            noResults.style.display = 'none';
            resultCount.textContent = `총 ${guides.length}개의 가이드`;
            
            const guideHTML = guides.map(guide => `
                <li>
                    <a href="${guide.url}">
                        <span class="guide-emoji">${guide.emoji}</span>
                        <span class="guide-title">${guide.title}</span>
                    </a>
                </li>
            `).join('');

            guidesList.innerHTML = guideHTML;
        }

        function searchGuides() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            if (searchTerm === '') {
                displayGuides(allGuides);
                return;
            }

            const filtered = allGuides.filter(guide => 
                guide.title.toLowerCase().includes(searchTerm) ||
                guide.description.toLowerCase().includes(searchTerm) ||
                guide.category.toLowerCase().includes(searchTerm)
            );

            displayGuides(filtered);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            displayGuides(allGuides);
        }

        document.addEventListener('DOMContentLoaded', loadGuides);
    </script>
