<body>
    <!-- ========== 헤더 ========== -->
    <header>
        <div class="header-container">
            <a href="/" class="logo">| 미국 부동산 인사이트 | <span>Real Estate Insight</span></a>
            <nav>
                <ul>
                    <li><a href="/">홈</a></li>

                    <li><a href="/#guides">가이드</a></li>
                    <li><a href="/#contact">문의</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ========== 메인 콘텐츠 ========== -->
    <main class="container">
        <!-- 히어로 섹션 -->
        <div class="hero">
            <h1>📚 LA 부동산 가이드</h1>
            <p>부동산 구매부터 세금, 법규까지 모든 정보</p>
        </div>

        <!-- 필터 섹션 -->
        <div class="filter-section">
            <label for="category-filter">카테고리:</label>
            <select id="category-filter">
                <option value="">전체</option>
            </select>
            <button onclick="resetFilter()">필터 초기화</button>
        </div>

        <!-- 가이드 그리드 -->
        <div class="guides-grid" id="guides-list">
            <!-- JSON에서 동적으로 생성됨 -->
        </div>

        <p style="margin-top: 2rem; opacity: 0.8;">

        </p>
    </footer>

    <!-- ========== 가이드 로드 스크립트 ========== -->
    <script>
        let allGuides = [];
        let filteredGuides = [];

        async function loadGuides() {
            try {
                console.log('📚 가이드 로드 시작...');
                
                const response = await fetch('/guides/guides.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ 가이드 로드 완료:', data.guides.length, '개');
                
                allGuides = data.guides;
                filteredGuides = [...allGuides];
                
                // 카테고리 필터 채우기
                const categories = [...new Set(allGuides.map(guide => guide.category))];
                const categorySelect = document.getElementById('category-filter');
                
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categorySelect.appendChild(option);
                });

                // 초기 표시
                displayGuides();
                
                // 필터 이벤트 리스너
                categorySelect.addEventListener('change', filterGuides);
            } catch (error) {
                console.error('💥 가이드 로드 실패:', error);
            }
        }

        function displayGuides() {
            const guidesList = document.getElementById('guides-list');
            
            const guideHTML = filteredGuides.map(guide => `
                <a href="${guide.url}" class="guide-card">
                    <div class="guide-image" style="background: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=600&q=80') center/cover;"></div>
                    <div class="guide-content">
                        <span class="guide-category">${guide.emoji} ${guide.category}</span>
                        <h3>${guide.title}</h3>
                        <p>${guide.description}</p>
                    </div>
                </a>
            `).join('');

            guidesList.innerHTML = guideHTML;
        }

        function filterGuides() {
            const selectedCategory = document.getElementById('category-filter').value;
            
            if (selectedCategory === '') {
                filteredGuides = [...allGuides];
            } else {
                filteredGuides = allGuides.filter(guide => guide.category === selectedCategory);
            }

            displayGuides();
        }

        function resetFilter() {
            document.getElementById('category-filter').value = '';
            filteredGuides = [...allGuides];
            displayGuides();
        }

        // 페이지 로드 시 가이드 로드
        document.addEventListener('DOMContentLoaded', loadGuides);
    </script>
