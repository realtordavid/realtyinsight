<body>
    <!-- ========== 헤더 ========== -->
    <header>

    </header>

    <!-- ========== 메인 콘텐츠 ========== -->
    <main class="container">
        <!-- 히어로 섹션 -->
        <div class="hero">
            <h1>📊 LA 부동산 마켓&트렌드</h1>
            <p>최신 부동산 시장 정보와 투자 트렌드</p>
        </div>

        <!-- 검색 섹션 -->
        <div class="search-section">
            <input type="text" id="search-input" placeholder="마켓 뉴스 검색... (예: 금리, 공급, 가격)">
            <button onclick="clearSearch()">초기화</button>
        </div>

        <!-- 결과 카운트 -->
        <div class="search-result-count" id="result-count"></div>

        <!-- 마켓 목록 -->
        <div class="market-list">
            <ul id="market-list">
                <!-- JSON에서 동적으로 생성됨 -->
            </ul>
        </div>

        <!-- 검색 결과 없음 -->
        <div class="no-results" id="no-results" style="display:none;">
            <p>🔍 검색 결과가 없습니다.</p>
            <p style="font-size: 0.95rem;">다른 키워드로 시도해보세요.</p>
        </div>
    </main>

        </p>
    </footer>

    <!-- ========== 마켓 뉴스 동적 로드 ========== -->
    <script>
        let allMarkets = [];

        async function loadMarkets() {
            try {
                console.log('📊 마켓 뉴스 로드 시작...');
                
                const response = await fetch('/market/market.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ 마켓 뉴스 로드 완료:', data.markets.length, '개');
                
                allMarkets = data.markets;
                displayMarkets(allMarkets);

                // 검색 이벤트 리스너
                document.getElementById('search-input').addEventListener('keyup', searchMarkets);
            } catch (error) {
                console.error('💥 마켓 뉴스 로드 실패:', error);
            }
        }

        function displayMarkets(markets) {
            const marketList = document.getElementById('market-list');
            const noResults = document.getElementById('no-results');
            const resultCount = document.getElementById('result-count');

            if (markets.length === 0) {
                marketList.innerHTML = '';
                noResults.style.display = 'block';
                resultCount.textContent = '';
                return;
            }

            noResults.style.display = 'none';
            resultCount.textContent = `총 ${markets.length}개의 마켓 뉴스`;
            
            const marketHTML = markets.map(market => `
                <li class="market-item">
                    <a href="${market.url}">
                        <div class="market-emoji">${market.emoji}</div>
                        <div class="market-content">
                            <h3>${market.title}</h3>
                            <p>${market.description}</p>
                            <div class="market-date">📅 ${market.date}</div>
                        </div>
                    </a>
                </li>
            `).join('');

            marketList.innerHTML = marketHTML;
        }

        function searchMarkets() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            if (searchTerm === '') {
                displayMarkets(allMarkets);
                return;
            }

            const filtered = allMarkets.filter(market => 
                market.title.toLowerCase().includes(searchTerm) ||
                market.description.toLowerCase().includes(searchTerm)
            );

            displayMarkets(filtered);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            displayMarkets(allMarkets);
        }

        document.addEventListener('DOMContentLoaded', loadMarkets);
    </script>
